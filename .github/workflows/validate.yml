name: Validate

on:
  pull_request:
  push:
    branches:
      - "**"

jobs:
  build:
    name: ${{ matrix.platform }}-${{ matrix.architecture }}
    uses: ./.github/workflows/build.yml
    strategy:
      fail-fast: false
      matrix:
        platform: [Linux, Mac, Windows]
        architecture: [ARM, X64]
    with:
      platform: ${{ matrix.platform }}
      architecture: ${{ matrix.architecture }}
