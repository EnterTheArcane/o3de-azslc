name: Build

on:
  workflow_call:
    inputs:
      platform:
        type: string
        required: true
      architecture:
        type: string
        required: true
      image:
        type: string
        required: false
      upload-artifacts:
        type: boolean
        default: false
    outputs:
      binary-artifact:
        value: ${{ jobs.main.outputs.binary-artifact }}

  workflow_dispatch:
    inputs:
      platform:
        description: Platform
        type: choice
        required: true
        options:
          - Linux
          - Mac
          - Windows
      architecture:
        description: Architecture
        type: choice
        required: true
        options:
          - ARM
          - X64
      upload-artifacts:
        description: Upload Artifacts
        type: boolean
        default: false

jobs:
  main:
    name: ${{ inputs.platform }}-${{ inputs.architecture }}

    runs-on: >-
      ${{
        inputs.image
        || (inputs.platform == 'Linux' && inputs.architecture == 'ARM' && 'ubuntu-24.04-arm')
        || (inputs.platform == 'Linux' && inputs.architecture == 'X64' && 'ubuntu-24.04')
        || (inputs.platform == 'Mac' && 'macos-15')
        || (inputs.platform == 'Windows' && inputs.architecture == 'ARM' && 'windows-11-arm')
        || (inputs.platform == 'Windows' && inputs.architecture == 'X64' && 'windows-2025')
      }}

    outputs:
      binary-artifact: ${{ inputs.platform }}-${{ inputs.architecture }}

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup CMake
        uses: lukka/get-cmake@f176ccd3f28bda569c43aae4894f06b2435a3375 # v4.2.3
        with:
          useCloudCache: true
          useLocalCache: true
          cmakeVersion: "4.2.3"
          ninjaVersion: "1.13.2"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "21"

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14"
          pip-install: -r requirements.txt
          cache: pip

      - name: Configure
        env:
          CMAKE_BUILD_TYPE: Release
          CMAKE_GENERATOR: Ninja
          CMAKE_TOOLCHAIN_FILE: ${{ github.workspace }}/Platform/${{ inputs.platform }}/Toolchain/${{ inputs.architecture }}.cmake
        run: cmake -B Build

      - name: Build
        run: cmake --build Build

      - name: Test
        run: >-
          ctest
          --test-dir Build
          --output-on-failure
          --no-tests=error
          --output-junit ../TestResults.xml

      - name: Test Report
        uses: dorny/test-reporter@b082adf0eced0765477756c2a610396589b8c637 # v2.5.0
        with:
          name: Tests (${{ inputs.platform }}-${{ inputs.architecture }})
          path: TestResults.xml
          reporter: java-junit

      - name: Upload Binary Artifact
        if: inputs.upload-artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ${{ inputs.platform }}-${{ inputs.architecture }}
          path: Build/bin/azslc${{ inputs.platform == 'Windows' && '.exe' || '' }}
          if-no-files-found: error
