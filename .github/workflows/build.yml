name: Build

on:
  push:

jobs:
  build:
    name: ${{ matrix.platform }} (${{ matrix.architecture }})

    strategy:
      fail-fast: false
      matrix:
        platform: [Linux, Mac, Windows]
        architecture: [ARM, X64]
        include:
          - platform: Linux
            image: ubuntu-24.04
          - platform: Mac
            image: macos-15
          - platform: Windows
            image: windows-2025

    runs-on: ${{ matrix.image }}

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup cmake
        uses: lukka/get-cmake@f176ccd3f28bda569c43aae4894f06b2435a3375 # v4.2.3
        with:
          useCloudCache: true
          useLocalCache: true
          cmakeVersion: "4.2.3"
          ninjaVersion: "1.13.2"

      - name: Install llvm
        uses: kylemayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0 # v2.0.9
        # Use xcode toolchain on macOS
        if: matrix.platform != 'Mac'
        with:
          version: "21.1.8"
          env: true

      - name: Build
        env:
          CMAKE_BUILD_TYPE: Release
          CMAKE_GENERATOR: Ninja
          CMAKE_TOOLCHAIN_FILE: ${{ github.workspace }}/Platform/${{ matrix.platform }}/Toolchain/${{ matrix.architecture }}.cmake
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
        run: |
          cmake -B Build
          cmake --build Build

      - name: Upload artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ${{ matrix.platform }}-${{ matrix.architecture }}
          path: Build/bin/azslc${{ matrix.platform == 'Windows' && '.exe' || '' }}
          if-no-files-found: error
          overwrite: true
