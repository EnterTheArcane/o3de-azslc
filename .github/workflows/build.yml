name: Build

on:
  push:

jobs:
  build:
    name: ${{ matrix.platform }}-${{ matrix.architecture }}

    strategy:
      fail-fast: false
      matrix:
        platform: [Linux, Mac, Windows]
        architecture: [ARM, X64]
        include:
          - platform: Linux
            image: ubuntu-24.04
          - platform: Mac
            image: macos-15
          - platform: Windows
            image: windows-2025

    runs-on: ${{ matrix.image }}

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup CMake
        uses: lukka/get-cmake@f176ccd3f28bda569c43aae4894f06b2435a3375 # v4.2.3
        with:
          useCloudCache: true
          useLocalCache: true
          cmakeVersion: "4.2.3"
          ninjaVersion: "1.13.2"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "21"

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14"
          pip-install: -r requirements.txt
          cache: pip

      - name: Setup Platform
        shell: pwsh
        run: Platform/${{ matrix.platform }}/RunnerSetup.ps1

      - name: Configure
        env:
          CMAKE_BUILD_TYPE: Release
          CMAKE_GENERATOR: Ninja
          CMAKE_TOOLCHAIN_FILE: ${{ github.workspace }}/Platform/${{ matrix.platform }}/Toolchain/${{ matrix.architecture }}.cmake
        run: cmake -B Build

      - name: Build
        run: cmake --build Build

      - name: Test
        run: >-
          ctest
          --test-dir Build
          --output-on-failure
          --no-tests=error
          --parallel 8
          --output-junit ../TestResults.xml

      - name: Test Report
        uses: dorny/test-reporter@b082adf0eced0765477756c2a610396589b8c637 # v2.5.0
        with:
          name: Tests (${{ matrix.platform }})
          path: TestResults.xml
          reporter: java-junit

      - name: Upload Artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ${{ matrix.platform }}-${{ matrix.architecture }}
          path: Build/bin/azslc${{ matrix.platform == 'Windows' && '.exe' || '' }}
          if-no-files-found: error
          overwrite: true
